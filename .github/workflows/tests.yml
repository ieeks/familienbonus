# Die Regressionstests laufen bei jeder Änderung. Sie brauchen weder Abhängigkeiten
# noch einen Build – ausgeliefert wird weiterhin nur index.html.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tests/run.mjs
